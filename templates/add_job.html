<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Job | Placement Management</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            Placement Portal
        </div>

        <div class="nav-links">

            <a href="/dashboard">Dashboard</a>
            <a href="/students">Students</a>
            <a href="/companies">Companies</a>
            <a href="/jobs">Jobs</a>
            <a href="#">Applications</a>
            <a href="#">Interviews</a>
            <a href="#">Placements</a>

        </div>

    </nav>


    <main class="form-container">

        <div class="form-card">

            <h1>Add Job</h1>

            <p class="form-subtitle">
                Create a new job opportunity
            </p>


            <form method="POST">

                <label>Company</label>

                <select name="company_id" required>

                    <option value="">
                        Select company
                    </option>

                    {% for company in companies %}

                    <option value="{{ company.company_id }}">
                        {{ company.company_name }}
                    </option>

                    {% endfor %}

                </select>


                <label>Job Role</label>

                <input
                    type="text"
                    name="job_role"
                    placeholder="e.g. Software Engineer"
                    maxlength="100"
                    required
                >


                <label>Package (LPA)</label>

                <input
                    type="number"
                    name="package"
                    placeholder="e.g. 12.50"
                    min="0"
                    step="0.01"
                    required
                >


                <label>Location</label>

                <input
                    type="text"
                    name="location"
                    placeholder="e.g. Pune"
                    maxlength="100"
                >


                <label>Minimum CGPA</label>

                <input
                    type="number"
                    name="min_cgpa"
                    placeholder="e.g. 7.50"
                    min="0"
                    max="10"
                    step="0.01"
                >


                <div class="form-buttons">

                    <a href="/jobs"
                       class="cancel-btn">
                        Cancel
                    </a>

                    <button
                        type="submit"
                        class="btn"
                    >
                        Add Job
                    </button>

                </div>

            </form>

        </div>

    </main>

</body>

</html>
